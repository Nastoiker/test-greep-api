name: max-chat

services:
  web:
    build:
      context: .
    init: true
    ports:
      - '127.0.0.1:${DOCKER_PORT:-5174}:5173'
    environment:
      WATCH_USE_POLLING: 'true'
    volumes:
      - type: bind
        source: .
        target: /app
      - type: volume
        source: node_modules
        target: /app/node_modules
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 120s
      retries: 3

volumes:
  node_modules:
